name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build and check site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test (structure, third-party and JS size)
        run: npm run smoke
      - name: Internal links and anchors
        run: npm run check:site
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 14
